x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  vaultwarden:
    image: vaultwarden/server:1.36.0-alpine
    container_name: vaultwarden
    restart: always
    logging: *default-logging
    stop_grace_period: 180s
    
    environment:
      - DOMAIN=${DOMAIN}:${HTTPS_PORT}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED}
      - ENABLE_DB_WAL=true
      - IP_HEADER=X-Forwarded-For
      - ORG_CREATION_USERS=all
      - TZ=Asia/Kolkata
    
    volumes:
      - ./vw-data:/data
    networks:
      - vault_network
    deploy:
      resources:
        limits:
          memory: 512M
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/alive"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
      start_interval: 2s


  
  caddy:
    image: caddy:2.11.4-alpine-porkbun
    container_name: caddy
    restart: always
    logging: *default-logging
    stop_grace_period: 60s
    
    ports:
      - "${HTTPS_PORT}:443"
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}
      - PORKBUN_API_KEY=${PORKBUN_API_KEY}
      - PORKBUN_API_SECRET_KEY=${PORKBUN_API_SECRET_KEY}
      - TZ=Asia/Kolkata 
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - vault_network
    deploy:
      resources:
        limits:
          memory: 256M
    
    depends_on:
      vaultwarden:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:

networks:
  vault_network:
    name: vault_network
    driver: bridge
