# Reusable logging configuration to prevent disk exhaustion
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  vaultwarden:
    image: vaultwarden/server:1.36.0-alpine
    container_name: vaultwarden
    restart: always
    logging: *default-logging
    environment:
      - DOMAIN=https://${DOMAIN}:${HTTPS_PORT}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED}
      # Enables Write-Ahead Logging for much better performance on slow GCP disks
      - ENABLE_DB_WAL=true
      - IP_HEADER=X-Forwarded-For
      - ORG_CREATION_USERS=all
    volumes:
      - ./vw-data:/data
    networks:
      - vault_network
    deploy:
      resources:
        limits:
          # Hard caps memory to prevent OOM kernel panics on the 1GB e2-micro
          memory: 356M
    healthcheck:
      # Actively tests if the web server is responding
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 60s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2.11.4-alpine-porkbun
    container_name: caddy
    restart: always
    logging: *default-logging
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}
      - PORKBUN_API_KEY=${PORKBUN_API_KEY}
      - PORKBUN_API_SECRET_KEY=${PORKBUN_API_SECRET_KEY}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - vault_network
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      vaultwarden:
        # Caddy will wait to boot until Vaultwarden passes its healthcheck
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:

networks:
  vault_network:
    name: vault_network
    driver: bridge
